services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: emonplan
      POSTGRES_USER: emonplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make setup first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U emonplan -d emonplan]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://emonplan:${POSTGRES_PASSWORD}@db:5432/emonplan?sslmode=disable
      OWNER_EMAIL: ${OWNER_EMAIL:?Run make setup first}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Run make setup first}
      SESSION_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
