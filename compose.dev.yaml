services:
  backend:
    image: golang:1.27-alpine
    build: !reset null
    working_dir: /src
    user: "0:0"
    volumes:
      - ./backend:/src
      - go_cache:/go/pkg/mod
    command: [sh, -c, "go run ./cmd/server"]
    develop:
      watch:
        - action: restart
          path: ./backend
  frontend:
    image: node:24-alpine
    build: !reset null
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://backend:8080
    command: [sh, -c, "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"]
volumes:
  go_cache:
  node_modules:
